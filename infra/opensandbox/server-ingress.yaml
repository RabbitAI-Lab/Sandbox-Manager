# NOTE: This file is for reference only. During setup, Ingress resources are
# dynamically generated by infraRunner.ts from DomainService.listDomains().
# To manually apply: kubectl apply -f server-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-server-ingress
  namespace: opensandbox-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - osb.sandbox.localhost
      secretName: sandbox-wildcard-tls
  rules:
    - host: osb.sandbox.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensandbox-server
                port:
                  number: 80
