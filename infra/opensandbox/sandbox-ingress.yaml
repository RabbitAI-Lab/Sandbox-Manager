# NOTE: This file is for reference only. During setup, Ingress resources are
# dynamically generated by infraRunner.ts from DomainService.listDomains().
# To manually apply: kubectl apply -f sandbox-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-wildcard-ingress
  namespace: opensandbox-system
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "opensandbox-ingress-gateway"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "*.sandbox.localhost"
    secretName: sandbox-wildcard-tls
  rules:
  - host: "*.sandbox.localhost"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opensandbox-ingress-gateway
            port:
              number: 80
