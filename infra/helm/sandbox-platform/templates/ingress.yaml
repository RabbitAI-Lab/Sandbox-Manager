{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sandbox-platform.fullname" . }}
  labels:
    app: {{ include "sandbox-platform.fullname" . }}
  annotations:
    nginx.ingress.kubernetes.io/websocket-services: "{{ include "sandbox-platform.fullname" . }}-backend"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    {{- range .Values.ingress.hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ include "sandbox-platform.fullname" $ }}-backend
            port:
              number: {{ $.Values.backend.service.port }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "sandbox-platform.fullname" $ }}-frontend
            port:
              number: {{ $.Values.frontend.service.port }}
  {{- end }}
{{- end }}
